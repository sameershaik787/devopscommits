
name: Build and Test

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build project
        run: |
          mkdir -p dist
          cp devopspractical/index.html dist/
          cp devopspractical/style.css dist/
          cp devopspractical/script.js dist/
          echo "Build completed successfully"

      - name: Test JavaScript syntax
        run: node --check devopspractical/script.js

      - name: Verify build output
        run: |
          test -s dist/index.html
          test -s dist/style.css
          test -s dist/script.js
          echo "All checks passed"

